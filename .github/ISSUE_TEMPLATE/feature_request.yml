name: Feature request
description: Suggest something new for the extension
title: "[Feature] "
labels: ["enhancement"]
body:
  - type: textarea
    id: description
    attributes:
      label: Description
      description: What do you want, and what problem does it solve?
    validations:
      required: true
  - type: textarea
    id: scope
    attributes:
      label: Scope
      description: What would make this done?
      placeholder: |
        - [ ] ...
        - [ ] ...
