name: Release

on:
  pull_request:
    types: [closed]
    branches: [main]

permissions:
  contents: write

jobs:
  release:
    if: github.event.pull_request.merged == true && startsWith(github.event.pull_request.head.ref, 'release/')
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          # pull_request events check out the merge SHA detached; `git push origin main` needs the branch
          ref: main
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci
        env:
          PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: 1

      - name: Configure Git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - name: Run version bump
        id: version
        run: |
          node scripts/version-bump.js
          echo "NEW_VERSION=$(node -p "require('./package.json').version")" >> $GITHUB_OUTPUT

      - name: Generate changelog summary
        id: summary
        run: echo "changelog_json=$(node scripts/summarize-changes.js)" >> "$GITHUB_OUTPUT"

      - name: Generate CHANGELOG.md
        run: |
          npx conventional-changelog -p angular -i CHANGELOG.md -s -r 0

      - name: Commit version bump and changelog
        run: |
          git add package.json public/manifest.json CHANGELOG.md
          git commit -m "chore(release): v${{ steps.version.outputs.NEW_VERSION }} [skip ci]"

      - name: Create git tag
        run: |
          git tag -a "v${{ steps.version.outputs.NEW_VERSION }}" -m "Release v${{ steps.version.outputs.NEW_VERSION }}"

      - name: Push changes and tag
        run: |
          git push origin main
          git push origin "v${{ steps.version.outputs.NEW_VERSION }}"

      # Dispatched from this job because the summary must be computed before the new tag exists
      - name: Dispatch changelog to website repo
        uses: peter-evans/repository-dispatch@v3
        with:
          token: ${{ secrets.CHANGELOG_BOT_TOKEN }}
          repository: OnDeck/ondeck-site
          event-type: changelog_update
          client-payload: ${{ steps.summary.outputs.changelog_json }}

      - name: Output summary
        env:
          NEW_VERSION: ${{ steps.version.outputs.NEW_VERSION }}
          CHANGELOG_JSON: ${{ steps.summary.outputs.changelog_json }}
        run: |
          {
            echo "### Release Summary 🚀"
            echo ""
            echo "- **Version:** v$NEW_VERSION"
            echo "- **Tag:** Created and pushed"
            echo "- **CHANGELOG.md:** Updated"
            echo "- **Website:** Changelog dispatched to OnDeck/ondeck-site"
            echo ""
            echo '```json'
            echo "$CHANGELOG_JSON"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
