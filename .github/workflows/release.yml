name: Release

on:
  # Every merge to main; should-release.js skips docs/chore-only merges and
  # leaves the first release (v1.0.0) to a manual run.
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      notes:
        description: 'Release notes for the site, one item per line (optional; defaults to a commit summary)'
        required: false
        type: string

permissions:
  contents: write

# Merges that land close together release one after another, never in parallel.
concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    env:
      HAS_SITE_TOKEN: ${{ secrets.CHANGELOG_BOT_TOKEN != '' }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          # The run can be started from any branch in the UI; always release main
          ref: main
          fetch-depth: 0
          # Deploy keys bypass the main ruleset, so the version bump can be pushed without a PR
          ssh-key: ${{ secrets.RELEASE_DEPLOY_KEY }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci
        env:
          PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: 1

      - name: Decide whether to release
        id: gate
        run: |
          if [ "$GITHUB_EVENT_NAME" = "workflow_dispatch" ]; then
            echo "release=true" >> "$GITHUB_OUTPUT"
          else
            node scripts/should-release.js >> "$GITHUB_OUTPUT"
          fi

      - name: Configure Git
        if: steps.gate.outputs.release == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - name: Run version bump
        if: steps.gate.outputs.release == 'true'
        id: version
        run: |
          node scripts/version-bump.js
          echo "NEW_VERSION=$(node -p "require('./package.json').version")" >> "$GITHUB_OUTPUT"

      # Notes come in through env, never interpolated into the script.
      - name: Generate changelog summary
        if: steps.gate.outputs.release == 'true'
        id: summary
        env:
          RELEASE_NOTES: ${{ inputs.notes }}
        run: echo "changelog_json=$(node scripts/summarize-changes.js)" >> "$GITHUB_OUTPUT"

      - name: Generate CHANGELOG.md
        if: steps.gate.outputs.release == 'true'
        run: npx conventional-changelog -p angular -i CHANGELOG.md -s -r 0

      - name: Commit version bump and changelog
        if: steps.gate.outputs.release == 'true'
        env:
          NEW_VERSION: ${{ steps.version.outputs.NEW_VERSION }}
        run: |
          git add package.json public/manifest.json CHANGELOG.md
          git commit -m "chore(release): v$NEW_VERSION [skip ci]"
          git tag -a "v$NEW_VERSION" -m "Release v$NEW_VERSION"

      # If another merge lands mid-run this push is rejected; the queued run
      # for that merge then releases both.
      - name: Push changes and tag
        if: steps.gate.outputs.release == 'true'
        env:
          NEW_VERSION: ${{ steps.version.outputs.NEW_VERSION }}
        run: |
          git push origin main
          git push origin "v$NEW_VERSION"

      # Dispatched from this job because the summary must be computed before the new tag exists
      - name: Dispatch changelog to website repo
        if: steps.gate.outputs.release == 'true' && env.HAS_SITE_TOKEN == 'true'
        uses: peter-evans/repository-dispatch@v3
        with:
          token: ${{ secrets.CHANGELOG_BOT_TOKEN }}
          repository: OnDeck/ondeck-site
          event-type: changelog_update
          client-payload: ${{ steps.summary.outputs.changelog_json }}

      - name: Output summary
        if: steps.gate.outputs.release == 'true'
        env:
          NEW_VERSION: ${{ steps.version.outputs.NEW_VERSION }}
          CHANGELOG_JSON: ${{ steps.summary.outputs.changelog_json }}
        run: |
          if [ "$HAS_SITE_TOKEN" = "true" ]; then
            SITE="Changelog dispatched to OnDeck/ondeck-site"
          else
            SITE="Skipped: add the CHANGELOG_BOT_TOKEN secret to update the site"
          fi
          {
            echo "### Release Summary 🚀"
            echo ""
            echo "- **Version:** v$NEW_VERSION"
            echo "- **Tag:** Created and pushed"
            echo "- **CHANGELOG.md:** Updated"
            echo "- **Website:** $SITE"
            echo ""
            echo '```json'
            echo "$CHANGELOG_JSON"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
