name: Assign Code Owner

on:
  # pull_request_target gets a write token for fork PRs too; safe because no PR code is checked out
  pull_request_target:
    types: [opened, reopened]
    branches: [main]

permissions:
  issues: write
  pull-requests: write

jobs:
  assign:
    runs-on: ubuntu-latest
    steps:
      - name: Assign Dillan-03
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_URL: ${{ github.event.pull_request.html_url }}
        run: gh pr edit "$PR_URL" --add-assignee Dillan-03
