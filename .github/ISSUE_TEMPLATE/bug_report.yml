name: Bug report
description: Something in the extension doesn't work as expected
title: "[Bug] "
labels: ["bug"]
body:
  - type: textarea
    id: description
    attributes:
      label: Description
      description: What went wrong?
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to Reproduce
      placeholder: |
        1. Open the popup
        2. Click ...
        3. See ...
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected Behavior
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual Behavior
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Extension version
      description: Shown on chrome://extensions
      placeholder: "1.0.0"
  - type: input
    id: browser
    attributes:
      label: Browser and OS
      placeholder: "Chrome 131, macOS 15"
  - type: textarea
    id: logs
    attributes:
      label: Screenshots or console errors
      description: Right-click the popup → Inspect → Console. Paste errors or drop screenshots here.
